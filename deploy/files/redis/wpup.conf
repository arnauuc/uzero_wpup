# /etc/redis/wpup.conf: included at the end of /etc/redis/redis.conf by
# deploy/steps/51-redis.sh (the last value wins).
#
# Unix socket only: no TCP port, so nothing to bind or expose. Access is by
# file permission: the socket belongs to group redis and the service user
# `wpup` is a member. Operators are not.
port 0
unixsocket /run/redis/redis-server.sock
unixsocketperm 770

# No persistence. Redis holds queues, locks and sessions; nothing in it is the
# source of truth (runs and secrets are in PostgreSQL) and no secret should ever
# sit in an RDB or AOF file on disk. A restart empties it: locks are leases that
# expire and `engine:recover` resumes interrupted runs.
save ""
appendonly no

# Defence in depth.
protected-mode yes
