# Journal retention for the tool server (ADR-0003 section 4: outbound
# connection log kept for 90 days). Installed as
# /etc/systemd/journald.conf.d/wpup.conf.
#
# MaxRetentionSec applies to the whole journal, not only to the
# "wpup-egress:" kernel lines. SystemMaxUse is the size cap: when it is hit,
# journald deletes the oldest entries first, so check with `journalctl
# --disk-usage` that 90 days fit (the egress log is rate limited to keep it
# small). Raise the cap rather than shortening the retention.
[Journal]
Storage=persistent
MaxRetentionSec=90day
SystemMaxUse=4G
RateLimitIntervalSec=30s
RateLimitBurst=10000
