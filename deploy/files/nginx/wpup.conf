# /etc/nginx/sites-available/wpup: the web panel (ADR-0008) on loopback only.
# Tailscale Serve terminates HTTPS and proxies to 127.0.0.1:@WEB_PORT@
# (ADR-0003). Nothing here listens on a public address.
server {
    listen 127.0.0.1:@WEB_PORT@;
    listen [::1]:@WEB_PORT@;
    server_name _;

    root /opt/uzero-wpup/public;
    index index.php;
    charset utf-8;

    client_max_body_size 4m;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/wpup-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # What Laravel needs to know when it sits behind Tailscale Serve.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
