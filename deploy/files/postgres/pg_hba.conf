# /etc/postgresql/17/main/pg_hba.conf (ADR-0004). Managed by deploy/steps/50-postgres.sh.
# Unix socket only, peer authentication, no passwords anywhere. The server does
# not listen on TCP at all (listen_addresses = ''), so there are no host lines.
#
# TYPE  DATABASE  USER        METHOD
local   all       postgres    peer
# The service user `wpup` becomes one of the two roles through pg_ident.conf.
# wpup_app: the application. wpup_owner: only for migrations when deploying.
local   wpup      wpup_app    peer map=wpup_app_map
local   wpup      wpup_owner  peer map=wpup_owner_map
# Anything else (operators included) is refused explicitly.
local   all       all         reject
