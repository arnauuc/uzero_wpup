# /etc/postgresql/17/main/conf.d/90-wpup.conf (ADR-0004). Managed by deploy/steps/50-postgres.sh.

# No TCP at all: only the Unix socket.
listen_addresses = ''
unix_socket_directories = '/var/run/postgresql'
# Only the owner of the server (postgres) and the group of the service user can
# open the socket; operators cannot even try (and pg_hba rejects them anyway).
unix_socket_group = 'wpup'
unix_socket_permissions = 0770

# Every DDL statement is logged (ADR-0004: the audit_log trigger can only be
# disabled with DDL, so it must leave a trace). Connections too.
log_statement = 'ddl'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
