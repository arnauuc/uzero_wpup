; /etc/php/8.4/fpm/pool.d/wpup.conf: PHP-FPM pool of the web panel (ADR-0008).
; Runs as the service user (ADR-0002) on a Unix socket; nginx proxies to it.
; This pool does NOT receive the KEK credential: the web never decrypts site
; credentials ("mai pel web", AGENTS.md); everything that needs them runs in
; Horizon or in the CLI.
[wpup]
user = wpup
group = wpup
listen = /run/php/wpup-fpm.sock
listen.owner = wpup
listen.group = wpup
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
pm.max_requests = 500

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 4M
catch_workers_output = yes
clear_env = yes
