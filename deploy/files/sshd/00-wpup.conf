# sshd hardening for the tool server (ADR-0003 section 2).
# Installed as /etc/ssh/sshd_config.d/00-wpup.conf. The "00-" prefix matters:
# sshd keeps the FIRST value it reads for each keyword, and Debian includes
# sshd_config.d/*.conf at the top of sshd_config, so this file wins.
#
# sshd listens on every address on purpose (so it does not depend on the start
# order of Tailscale); the nftables policy only lets port 22 in through
# tailscale0.

# Keys only. No passwords, no keyboard-interactive, no root.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Unix groups of the people who may log in (names: see docs/runbooks/xarxa.md).
AllowGroups @OPERATORS_GROUP@ @ADMINS_GROUP@

# General hardening.
UsePAM yes
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 5:50:20
MaxSessions 6
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
DisableForwarding yes
